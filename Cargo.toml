[workspace]
resolver = "2"
members = [
    "live-match-monitor",
    "rss-feed-notifier",
    "nrl-tracker",
    "super-league-tracker",
    "super-xiii-tracker",
    "pirate-utils"
]

# This ensures all your crates use the same dependency versions
[workspace.dependencies]
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "json", "native-tls"] }
serde_json = "1.0"
dotenvy = "0.15"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"